services:
  api:
    volumes:
      - ./api:/app
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  web:
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0

volumes:
  web_node_modules:
